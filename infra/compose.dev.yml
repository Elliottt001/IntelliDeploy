services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: intellideploy
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: intellideploy_dev
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intellideploy -d intellideploy_dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data: {}
