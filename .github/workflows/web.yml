name: Web workspace checks
on:
  pull_request:
    paths: ['web/**', 'packages/api-client/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  push:
    paths: ['web/**', 'packages/api-client/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --workspace @intellideploy/api-client run build
      - run: npm --workspace @intellideploy/api-client test
      - run: npm --workspace web test
      - run: npm --workspace web run typecheck
      - run: npm --workspace web run build
      - run: npm --workspace web exec -- playwright install --with-deps chromium
      - run: npm --workspace web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check-results
          path: |
            web/test-results
            web/.next/standalone
