appId: cn.elliotttzhang.intellideploy
name: Browse created copied favorite and recent folders using real IDs
tags: [phase1, products]
onFlowStart:
  - launchApp:
      clearState: false
---
- openLink: intellideploy://app-gallery
- assertVisible:
    id: product-folder-created
- tapOn:
    id: product-folder-created
- tapOn:
    id: products-actions-open
- tapOn: 我的副本
- tapOn:
    id: product-folder-copies
- tapOn:
    id: products-actions-open
- tapOn: 我的收藏
- assertVisible:
    id: product-folder-favorites
- tapOn:
    id: product-folder-favorites
- back
- tapOn:
    id: products-actions-open
- tapOn: 最近使用
- assertVisible:
    id: product-folder-recent
- tapOn:
    id: product-folder-recent
- back
- tapOn:
    id: products-actions-open
- tapOn: 我创建的
- tapOn:
    id: product-folder-created
- tapOn:
    id: products-actions-open
- tapOn:
    id: products-app-list-toggle
- scrollUntilVisible:
    element:
      id: product-row-${APP_ID}
    direction: DOWN
- tapOn:
    id: product-row-${APP_ID}
- assertVisible:
    id: job-status
- tapOn:
    id: chatbot-settings
- tapOn:
    id: delivery-management-toggle
- assertVisible:
    id: app-detail-secondary
