appId: cn.elliotttzhang.intellideploy
name: Open a publication and create an independent copy
tags:
  - phase1
  - community
onFlowStart:
  - launchApp:
      clearState: false
---
- openLink: intellideploy://community/${PUBLICATION_ID}
- assertVisible: 创建我的副本
- tapOn:
    id: copy-publication
- assertVisible:
    id: job-status
- extendedWaitUntil:
    visible:
      id: job-status
      text: 应用已交付
    timeout: 1800000
- tapOn:
    id: open-app
